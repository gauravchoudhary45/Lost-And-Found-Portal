{% extends "layout.html" %}
{% block main_content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card p-4 shadow-sm bg-white">
            <h2 class="fw-bold text-danger mb-3">Report a Lost Item</h2>
            <form method="POST" action="{{ url_for('report_lost') }}" enctype="multipart/form-data">
                
                <div class="mb-3">
                    <label class="form-label fw-bold">Item Title</label>
                    <input type="text" name="title" class="form-control" placeholder="e.g., iPhone 14 Pro Max" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Item Category</label>
                    <select name="category" class="form-select" required>
                        {% for cat in categories %}
                            <option value="{{ cat }}">{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Where did you lose it? (Manual Entry)</label>
                    <input type="text" name="location" class="form-control" placeholder="e.g., On the third floor table next to the library cafeteria window" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Approximate Missing Date</label>
                    <input type="date" name="date" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Detailed Descriptive Traits</label>
                    <textarea name="description" class="form-control" rows="4" placeholder="Mention stickers, case color details, internal features..." required></textarea>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Attach Item Reference Image</label>
                    <input type="file" name="item_image" class="form-control" accept="image/*">
                </div>

                <button type="submit" class="btn btn-danger w-100 py-2 fw-bold">Publish Missing Report</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
