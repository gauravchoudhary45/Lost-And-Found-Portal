{% extends "layout.html" %}
{% block main_content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card p-4 shadow-sm bg-white">
            <h2 class="fw-bold text-success mb-3">Post a Discovered Item Notice</h2>
            <form method="POST" action="{{ url_for('post_found') }}" enctype="multipart/form-data">
                
                <div class="mb-3">
                    <label class="form-label fw-bold">Generalized Item Title</label>
                    <input type="text" name="title" class="form-control" placeholder="e.g., Smart Phone, Set of Keys" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Item Category</label>
                    <select name="category" class="form-select" required>
                        {% for cat in categories %}
                            <option value="{{ cat }}">{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Where did you find it? (Manual Entry)</label>
                    <input type="text" name="location" class="form-control" placeholder="e.g., Under the green bench in the main playground area" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Discovery Calendar Date</label>
                    <input type="date" name="date" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Generalized Public Description</label>
                    <textarea name="description" class="form-control" rows="4" placeholder="Omit sensitive specifications like passwords, cash values..." required></textarea>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Attach Discovered Item Image</label>
                    <input type="file" name="item_image" class="form-control" accept="image/*">
                </div>

                <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Publish Found Item Notice</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
